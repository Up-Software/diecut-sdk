version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # Node types must match the minimum supported runtime (engines.node >=20).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # vitest 5+ drops Node 20, which is still a supported runtime.
      - dependency-name: 'vitest'
        versions: ['>=5']
      - dependency-name: '@vitest/coverage-v8'
        versions: ['>=5']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
