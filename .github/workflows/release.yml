name: Release

# Publishes to npm when a GitHub release is published.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# npm generates provenance attestations automatically for public packages.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5

      # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      - run: npm ci
      - run: npm run build
      - run: npm test

      # Pre-release versions (for example 0.2.0-beta.1) are published under the "next" dist-tag.
      - name: Publish
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
