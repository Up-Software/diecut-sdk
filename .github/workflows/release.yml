name: Release

# Publishes to npm when a GitHub release is published.
# Authentication uses npm trusted publishing (OIDC): no npm token is stored in the repository.
# npm generates provenance attestations automatically for public packages.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Trusted publishing requires Node >= 22.14.0 and npm >= 11.5.1.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          # No dependency cache in the publishing job: a poisoned cache could end up in the package.
          package-manager-cache: false

      # Node.js 24 ships a recent enough npm; check it instead of installing npm outside the lockfile.
      - name: Check the npm version
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) { console.error(`npm ${process.argv[1]} is older than 11.5.1`); process.exit(1); }
          ' "$(npm --version)"

      - name: Check that the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Release tag v$TAG does not match package.json version $VERSION"
            exit 1
          fi

      # Re-running a release, or creating the release of a version that was published by hand
      # (such as 0.1.0), must not fail: npm rejects publishing the same version twice.
      - name: Check whether this version is already on npm
        id: published
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION is already published, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.exists == 'false'
        run: npm ci
      - if: steps.published.outputs.exists == 'false'
        run: npm run build
      - if: steps.published.outputs.exists == 'false'
        run: npm test

      # Pre-release versions (for example 0.2.0-beta.1) are published under the "next" dist-tag.
      - name: Publish
        if: steps.published.outputs.exists == 'false'
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
