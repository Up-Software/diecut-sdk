name: Workflow security

# Audits the GitHub Actions workflows with zizmor: unpinned actions, credential persistence,
# template injection, excessive permissions and similar supply chain risks.

on:
  push:
    branches: [main]
    paths: ['.github/**']
  pull_request:
    paths: ['.github/**']

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings are printed in the job log and fail the job, instead of being uploaded to
      # code scanning, so they block the pull request that introduces them.
      - uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
